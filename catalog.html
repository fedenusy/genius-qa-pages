<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hinge Parts Catalog</title></head><body>
<h1>Hinge Parts Catalog</h1>
<p>Fictional test page. Parts load five at a time.</p>
<ol id="parts"></ol>
<button type="button" id="more">Load more</button>
<p id="o"></p>
<script>
var finishes=['Brass','Steel','Bronze','Nickel','Brass','Black iron','Brass','Chrome'];
var kinds=['butt hinge','strap hinge','piano hinge','spring hinge','barrel hinge'];
var all=[];for(var i=0;i<40;i++){all.push(finishes[i%8]+' '+kinds[i%5]+' #'+(101+i));}
var shown=0,list=document.getElementById('parts'),more=document.getElementById('more');
function load(){var next=Math.min(shown+5,all.length);for(;shown<next;shown++){var li=document.createElement('li');li.textContent=all[shown];list.appendChild(li);}
if(shown>=all.length){more.hidden=true;document.getElementById('o').textContent='All 40 parts loaded.';}}
more.onclick=function(){more.disabled=true;setTimeout(function(){load();more.disabled=false;},1500);};
load();
</script></body></html>
