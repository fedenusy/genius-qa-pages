<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Test Mutual: file a claim</title></head><body>
<h1>Acme Test Mutual: file a claim</h1>
<form id="f" onsubmit="return false">
<section data-step="1"><h2>Step 1 of 3: About you</h2>
<label>Full name <input name="name"></label><br><label>Date of birth <input name="dob"></label><br><label>Policy number <input name="policy" placeholder="HM-000000"></label><br>
<button type="button" onclick="go(2)">SAVE CONTINUE</button></section>
<section data-step="2" hidden><h2>Step 2 of 3: What happened</h2>
<label>Describe the damage <textarea name="desc"></textarea></label><br>
<button type="button" onclick="go(fee?'fee':3)">SAVE CONTINUE</button></section>
<section data-step="fee" hidden><h2>Filing fee</h2><p>A $25 filing fee is due before we accept your claim.</p>
<button type="button" onclick="document.getElementById('paid').textContent='Fee paid: $25';go(3)">Pay $25</button> <span id="paid"></span></section>
<section data-step="3" hidden><h2>Step 3 of 3: Review</h2><p>Check your answers, then submit. You cannot change a submitted claim.</p>
<button type="button" onclick="go('done')">SUBMIT CLAIM</button></section>
<section data-step="done" hidden><h2>Claim submitted</h2><p>Claim number HM-C-48213.</p></section>
</form>
<script>const fee=new URLSearchParams(location.search).get('fee')==='1';function go(s){document.querySelectorAll('section').forEach(x=>x.hidden=x.dataset.step!=String(s));}</script>
</body></html>
